<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Companion</title>
<style>
    *,*::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f0f0f;
        color: #e5e5e5;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    header {
        padding: 16px 24px;
        background: #1a1a1a;
        border-bottom: 1px solid #2a2a2a;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
    }

    .logo {
        width: 36px;
        height: 36px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        border-radius: 8px;
        display: flex; 
        align-items: center;
        justify-content: center;
        font-size: 18px;
    }

    header h1 { font-size: 17px; font-weight: 600; color: #f0f0f0; }
    header .subtitle { font-size: 12px; color: #888; }

    #messages {
        flex: 1; 
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    .message {
        display: flex;
        gap: 12px;
        max-width: 780px;
        width: 100%;
    }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.assistant { align-self: flex-start; }

    .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 600;
        align-self: flex-end; 
    }
    
    .message.user .avatar { background: #4f46e5; color: white; }
    .message.assistant .avatar { background: #1e293b; color: #94a3b8; border: 1px solid #2a2a2a; }

    .bubble {
        padding: 12px 16px; 
        border-radius: 16px;
        line-height: 1.6;
        font-size: 14px;
        max-width: calc(100% - 44px);
        white-space: pre-wrap;
        word-break: break-word;
    }

    .message.user .bubble {
        background: #4f46e5;
        color: #fff;
        border-bottom-right-radius: 4px;
    }

    .message.assistant .bubble {
        background: #1a1a1a;
        color: #e5e5e5;
        border: 1px solid #2a2a2a;
        border-bottom-left-radius: 4px;
    }

    .bubble.error { background: #2d1b1b; border-color: #5a2a2a; color: #f87171; }

    .typing .bubble {
        display: flex;
        gap: 4px;
        align-items: center;
        padding: 16px;
        min-width: 60px;
    }

    .dot {
        width: 7px; height: 7px;
        background: #555;
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out;
    }
    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) {animation-delay: 0.2s; }
    .dot:nth-child(3) {animation-delay: 0.4s; }

    @keyframes bounce {
        0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
        40% { transform: scale(1.2); opacity: 1; }
    }

    #input-area {
        padding: 16px 24px 20px;
        background: #0f0f0f;
        border-top: 1px solid #1e1e1e;
        flex-shrink: 0;
    }

    #input-form {
        display: flex;
        gap: 10px;
        max-width: 780px;
        margin: 0 auto;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 14px;
        padding: 10px 10px 10px 16px;
        transition: border-color 0.2s;
    }

    #input-form:focus-within {border-color: #4f46e5; }
    #question {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: #e5e5e5;
        font-size: 14px;
        font-family: inherit;
        line-height: 1.5;
        resize: none;
        max-height: 160px;
        min-height: 24px;
    }

    #question::placeholder { color: #555; }
    
    #send-btn {
        width: 36px; height: 36px;
        background: #4f46e5;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: background 0.2s, transform 0.1s;
        align-self: flex-end;
    }

    #send-btn:hover { background: #4338ca; }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { background: #2a2a2a; cursor: not-allowed; }

    .hint-text { text-align: center; font-size: 11px; color: #444; margin-top: 10px; }

    .welcome {
        align-self: center;
        text-align: center;
        max-width: 480px;
        padding: 32px 24px;
    }

    .welcome .icon { font-size: 48px; margin-bottom: 16px; }
    .welcome h2 { font-size: 22px; font-weight: 700; margin-bottom: 10px; color: #f0f0f0; }
    .welcome p { font-size: 14px; color: #888; line-height: 1.7; }

    .suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 20px; 
    }

    .suggestion-btn {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 20px;
        padding: 7px 14px;
        font-size: 13px;
        color: #aaa; 
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
    }

    .suggestion-btn:hover { border-color: #4f46e5; color: #a5b4fc; background: #1e1a3a; }
</style>
</head>
<body>
<header>
    <div class="logo">📚</div>
    <div> 
        <h1>Lab Companion</h1>
        <div class="subtitle">Hints only, not answers</div>
    </div>
</header>

<div id="messages">
    <div class="welcome" id = "welcome">
        <div class="icon">💡</div>
        <h2>How can I help you today?</h2>
        <p>I'l guide you through the lab with hints and questions - not direct answers. Ask me about concepts you're seeing, or where to start.</p>
        <div class="suggestions">
            <button class="suggestion-btn" onclick="fillQuestion(this)">Why isn't my circuit working?</button>
            <button class="suggestion-btn" onclick="fillQuestion(this)">Explain KVL to me</button>
            <button class="suggestion-btn" onclick="fillQuestion(this)">What does this error mean?</button>
            <button class="suggestion-btn" onclick="fillQuestion(this)">Where do I start?</button>
        </div>
    </div>
</div>

<div id = "input-area">
    <form id="input-form" onsubmit="sendMessage(event)">
        <textarea
        id="question"
        placeholder="Ask about the lab..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
    ></textarea>
    <button type="submit" id="send-btn" title="Send">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M14 8L2 2l2.5 6L2 14l12-6z" fill="white"/>
            </svg>
        </button>
    </form>
    <p class="hint-text">Cal Poly Student UI - Powered by Lab Companion</p>
</div>
<script>
    const history = [];

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 160) + 'px';
    }

    function handleKey(e) {
        if (e.key === 'Enter' &&  !e.shiftKey) {
            e.preventDefault();
            document.getElementById('input-form').dispatchEvent(new Event('submit'));
        }
    }

    function fillQuestion(btn) {
        const ta = document.getElementById('question');
        ta.value = btn.textContent;
        autoResize(ta);
        ta.focus();
    }

    function scrollBottom() {
        const el = document.getElementById('messages');
        el.scrollTop = el.scrollHeight;
    }

    function appendMessage(role, content, isError = false) {
        const welcome = document.getElementById('welcome');
        if (welcome) welcome.remove();

        const wrap = document.createElement('div');
        wrap.className = `message ${role}`;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? 'S' : '🎓';

        const bubble = document.createElement('div');
        bubble.className = 'bubble' + (isError ? ' error' : '');
        bubble.textContent = content;

        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        document.getElementById('messages').appendChild(wrap);
        scrollBottom();
    }
    
    function showTyping() {
        const welcome = document.getElementById('welcome');
        if (welcome) welcome.remove();

        const wrap = document.createElement('div');
        wrap.className = 'message assistant typing';
        wrap.id = 'typing-indicator';

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = '🎓';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        document.getElementById('messages').appendChild(wrap);
        scrollBottom();
    }

    function removeTyping() {
        const el = document.getElementById('typing-indicator');
        if (el) el.remove();
    }

    async function sendMessage(e) {
        e.preventDefault();
        const ta = document.getElementById('question');
        const btn = document.getElementById('send-btn');
        const question = ta.value.trim();
        if (!question) return;

        ta.value = '';
        ta.style.height = 'auto';
        btn.disabled = true;

        appendMessage('user', question);
        history.push({ role: 'user', content: question });

        showTyping();

        try {
            const res = await fetch('/api/turn', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question,
                    conversation_history: history.slice(-12),
                    guidance_level: 'FULL',
                })
            });

            const data = await res.json();
            removeTyping();

            if (data.status === 'completed' && data.response) {
                appendMessage('assistant', data.response);
                history.push({ role: 'assistant', content: data.response });
            } else {
                appendMessage('assistant', data.error || 'Something went wrong. Please try again.', true);
            }
        } catch (err) {
            removeTyping();
            appendMessage('assistant', 'Connection error. Please check your network and try again.', true);
        } 

        btn.disabled = false;
        ta.focus();
    }
</script>
</body>
</html>
